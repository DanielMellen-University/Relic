name: CI
on:
  push:
  pull_request:
jobs:
  # The default build (C5): only a C compiler. bootstrap/cgen.c builds
  # relicc_stage0, which builds relicc from selfhost/cgen.relic; relicc
  # compiles the goldens. Also checks bootstrap/cgen.c is not stale
  # (bootstrap_fresh) and that relicc compiles itself to the same C, then
  # builds tests/consumer, a project that adds Relic with add_subdirectory.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Consuming project (relic_add_program through add_subdirectory)
        run: |
          cmake -S tests/consumer -B build-consumer -DCMAKE_BUILD_TYPE=Release
          cmake --build build-consumer --config Release
          ctest --test-dir build-consumer -C Release --output-on-failure

  # A fresh checkout on a system with no C++ compiler at all (Alpine: gcc
  # without g++). Proves the default build needs only C.
  no-cxx:
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - name: Install a C toolchain only
        run: apk add --no-cache gcc musl-dev make cmake git
      - uses: actions/checkout@v4
      - name: No C++ compiler here
        run: |
          for c in c++ g++ clang++; do
            if command -v $c; then echo "found $c"; exit 1; fi
          done
          echo "no C++ compiler"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Consuming project (relic_add_program through add_subdirectory)
        run: |
          cmake -S tests/consumer -B build-consumer -DCMAKE_BUILD_TYPE=Release
          cmake --build build-consumer -j 4
          ctest --test-dir build-consumer --output-on-failure

  # The C++ host (tree-walker, VM, REPL) and all its tests, plus the
  # cross-checks: cgen on the host writes bootstrap/cgen.c exactly
  # (bootstrap_matches_host), relicc writes the same C as the host for every
  # golden (cgen_stage1_matches_host), and the self-host checks.
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRELIC_BUILD_HOST=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # Graphics, headless: the host's SDL2 built-ins (-DRELIC_SDL=ON) and the
  # C runtime's SDL2 module, relic_rt_gfx (-DRELIC_C_SDL=ON), with SDL2_image,
  # SDL2_ttf and a TrueType font so every graphics test runs (gfx_*, c_gfx_*,
  # mini_desktop, c_mini_desktop); the job fails if any of the 12 is missing.
  # ctest sets SDL_VIDEODRIVER=dummy. SDL2 comes from apt on Ubuntu (pinned to
  # 24.04 so the packages do not move under it), Homebrew on macOS (sdl2 there
  # is sdl2-compat over SDL3) and vcpkg with MSVC on Windows.
  sdl:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      # SDL3's name for the same setting (sdl2-compat on macOS).
      SDL_VIDEO_DRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      # Bound the package install so a stalled mirror connection fails fast
      # instead of burning the whole job timeout; apt retries stalled fetches.
      - name: Install SDL2 (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 install --yes --no-install-recommends \
            cmake g++ pkg-config libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev fonts-dejavu-core
          echo "RELIC_CMAKE_EXTRA=" >> "$GITHUB_ENV"
      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: |
          brew install sdl2 sdl2_image sdl2_ttf
          echo "RELIC_CMAKE_EXTRA=-DCMAKE_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"
      # vcpkg ships on the Windows runner. Built packages are cached between
      # runs; the toolchain file copies the SDL2 DLLs next to every program.
      - name: Cache vcpkg packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-sdl2-x64-windows-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: vcpkg-sdl2-x64-windows-
      - name: Install SDL2 (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 40
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/vcpkg-cache"
          export VCPKG_DEFAULT_BINARY_CACHE="$GITHUB_WORKSPACE/vcpkg-cache"
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install sdl2 sdl2-image sdl2-ttf --triplet x64-windows
          tc=$(cygpath -m "$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake")
          echo "RELIC_CMAKE_EXTRA=-DCMAKE_TOOLCHAIN_FILE=$tc -DVCPKG_TARGET_TRIPLET=x64-windows" >> "$GITHUB_ENV"
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRELIC_SDL=ON -DRELIC_C_SDL=ON -DRELIC_C_WERROR=ON $RELIC_CMAKE_EXTRA
      - name: All 12 graphics tests are there
        shell: bash
        run: |
          n=$(ctest --test-dir build -C Release -N -R "gfx_|mini_desktop" | grep -c "Test *#")
          echo "$n graphics tests"
          test "$n" -eq 12
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel 4

  # The C runtime (runtime/c) built on its own with warnings as errors.
  # gcc and clang use -std=c99 -Wall -Wextra -pedantic; MSVC uses /std:c11 /W4,
  # its closest mode for C99 code. The Linux jobs also run ASan, UBSan and LSan.
  c-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-sanitize
            os: ubuntu-latest
            cc: gcc
            flags: -DRELIC_C_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          - name: linux-clang-sanitize
            os: ubuntu-latest
            cc: clang
            flags: -DRELIC_C_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          - name: macos-clang
            os: macos-latest
            cc: clang
            flags: -DCMAKE_BUILD_TYPE=Release
          - name: windows-msvc
            os: windows-latest
            cc: cl
            flags: ""
    name: c-runtime (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S runtime/c -B build-c -DCMAKE_C_COMPILER=${{ matrix.cc }} -DRELIC_C_WERROR=ON ${{ matrix.flags }}
      - name: Build
        run: cmake --build build-c --config Release
      - name: Test
        run: ctest --test-dir build-c -C Release --output-on-failure

  # The C-only build strict: the bootstrap compiler, relicc and every
  # compiled golden built with the runtime's flags and warnings as errors.
  # The Linux jobs run ASan, UBSan and LSan on all of it.
  cgen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-sanitize
            os: ubuntu-latest
            cc: gcc
            flags: -DRELIC_C_SANITIZE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          - name: linux-clang-sanitize
            os: ubuntu-latest
            cc: clang
            flags: -DRELIC_C_SANITIZE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          - name: macos-clang
            os: macos-latest
            cc: clang
            flags: -DCMAKE_BUILD_TYPE=Release
          - name: windows-msvc
            os: windows-latest
            cc: cl
            flags: ""
    name: cgen (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DRELIC_C_WERROR=ON ${{ matrix.flags }}
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
